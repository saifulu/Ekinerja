<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anda Sedang Offline - e-Kinerja</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 70%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon-circle {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px auto;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-circle svg {
            width: 44px;
            height: 44px;
            fill: #f87171;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }
        .btn-retry:active {
            transform: scale(0.98);
        }
        .status-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-3.66-11.64-3.66C5.29 3.34.81 6.66.36 7l10.08 12.56c.8 1 2.32 1 3.12 0L23.64 7z" opacity="0.3"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Aplikasi e-Kinerja tidak dapat menghubungi server. Mohon periksa koneksi Wi-Fi atau paket data seluler Anda, lalu muat ulang halaman.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Muat Ulang Halaman
        </button>
        <div>
            <span class="status-badge" id="netStatus">Sedang offline</span>
        </div>
    </div>

    <script>
        window.addEventListener('online', () => {
            const badge = document.getElementById('netStatus');
            if (badge) {
                badge.textContent = 'Koneksi terhubung kembali! Memuat...';
                badge.style.color = '#34d399';
            }
            setTimeout(() => window.location.reload(), 1000);
        });
    </script>
</body>
</html>
